# A paced walkthrough of every interaction, for recording a demo on the iOS Simulator:
#   xcrun simctl io booted recordVideo --codec=h264 demo.mov   (in another terminal)
#   JAVA_HOME=… maestro test maestro/demo.yaml
# Run it against a Release build (`expo run:ios --configuration Release`): a debug build's
# dev-client button sits over the sheets' Save button. Seeds are relative to today.
appId: com.coss.kloq.example
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Quick add"
    timeout: 30000
- runFlow: pause.yaml

