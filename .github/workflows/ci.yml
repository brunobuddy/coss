name: CI

# Only the merge queue lands commits on main (main's ruleset), so this is the one place they're
# checked:
# - pull requests get quick feedback: lint, then typecheck, tests and builds of the packages the
#   change reaches (`turbo --affected`);
# - the merge queue (`merge_group`) runs lint, typecheck, tests and builds of every package (the
#   remote cache replays what didn't change) on the exact commit main becomes, so main itself
#   isn't checked again and Deploy doesn't wait for CI;
# - both run only the SDK and driver entries the change can reach (`changes`), so a nightly run
#   (and any dispatch) checks everything, on main.
# `ci`, the last job, is the ruleset's one required check. Every job runs on Blacksmith's runners
# (GitHub's free ones allow 20 jobs at once, which one run of this workflow nearly fills).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # GitHub emails a failure to whoever last changed this line.
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values. No .env file exists in CI; turbo passes these via globalPassThroughEnv.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  API_PUBLIC_URL: http://localhost:3001
  PORTAL_PUBLIC_URL: http://localhost:3003
  API_PORT: "3001"
  EMAIL_PROVIDER: fake
  WEBHOOK_SECRETS_KEY: Y2ktb25seS13ZWJob29rLXNlY3JldHMta2V5LTMyYnk=
  TEST_VALKEY_URL: redis://localhost:6379
  # Pull requests run on GitHub's merge with main: its first parent is main, so `--affected` sees
  # exactly the pull request's changes (the checkouts fetch that one parent too).
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: HEAD^1

# check, test and build run in parallel. Tests are never cached (turbo.json).
jobs:
  # Which entries of the SDK and driver matrices this change needs, on pull requests and in the
  # merge queue alike: an SDK or driver only when its own directory changed, or what it's tested
  # against: the API's contract (`openapi.json`, which the API's responses are built from), the
  # test app (`serve.ts`), its conformance files, or this file. API behaviour behind an unchanged
  # contract is the API's own tests' (the TypeScript SDK and the drivers' JS siblings run against
  # it in-process); the nightly run checks every entry anyway. Matrix entries live here because
  # a static matrix can't be filtered.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      sdks: ${{ steps.plan.outputs.sdks }}
      integrations: ${{ steps.plan.outputs.integrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # main when the merge group was made: the diff covers the group's earlier entries too.
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          # Each driver against the newest and the oldest framework it supports.
          INTEGRATIONS: |
            [
              { "driver": "laravel", "versions": "PHP 8.5, latest", "php": "8.5", "e2e": true, "lint": true },
              { "driver": "laravel", "versions": "PHP 8.2, lowest", "php": "8.2", "composer": "--prefer-lowest" },
              { "driver": "rails", "versions": "Ruby 3.4, Rails 8.1", "ruby": "3.4", "rails": "8.1", "e2e": true },
              { "driver": "rails", "versions": "Ruby 3.2, Rails 7.2", "ruby": "3.2", "rails": "7.2" },
              { "driver": "django", "versions": "Python 3.14, Django 6.1", "python": "3.14", "django": "django>=6.1,<6.2", "e2e": true },
              { "driver": "django", "versions": "Python 3.10, Django 5.2", "python": "3.10", "django": "django>=5.2,<5.3" }
            ]
          # Each SDK on the newest and the oldest runtime it supports. PHPUnit 12 needs PHP 8.3, so
          # on 8.1 (the oldest supported) only the syntax check runs. Gradle runs on 17+; the jar
          # targets Java 8. The .NET test project targets .NET 9; the package also builds for .NET
          # Framework and Standard.
          SDKS: |
            [
              { "sdk": "python", "versions": "Python 3.14", "python": "3.14", "e2e": true },
              { "sdk": "python", "versions": "Python 3.10", "python": "3.10" },
              { "sdk": "go", "versions": "Go stable", "go": "stable", "e2e": true },
              { "sdk": "go", "versions": "Go 1.21", "go": "1.21" },
              { "sdk": "ruby", "versions": "Ruby 3.4", "ruby": "3.4", "e2e": true },
              { "sdk": "ruby", "versions": "Ruby 3.3", "ruby": "3.3" },
              { "sdk": "php", "versions": "PHP 8.5", "php": "8.5", "e2e": true },
              { "sdk": "php", "versions": "PHP 8.1", "php": "8.1", "syntax-only": true },
              { "sdk": "java", "versions": "Java 21", "java": "21", "e2e": true },
              { "sdk": "java", "versions": "Java 17", "java": "17" },
              { "sdk": "dotnet", "versions": ".NET 10", "dotnet": "10.0.x", "e2e": true },
              { "sdk": "dotnet", "versions": ".NET 9", "dotnet": "9.0.x" }
            ]
        run: |
          case "$EVENT" in
            pull_request) changed="$(git diff --name-only HEAD^1 HEAD)" ;;
            merge_group)
              git fetch --quiet --depth=1 origin "$MERGE_GROUP_BASE"
              changed="$(git diff --name-only "$MERGE_GROUP_BASE" HEAD)"
              ;;
            # The nightly run and dispatches: everything.
            *) changed="*" ;;
          esac
          # $1: the entries, $2: the key naming each one's directory under $3, $4: what every entry
          # is tested against.
          pick() {
            jq --compact-output --arg changed "$changed" --arg key "$2" --arg dir "$3" --arg shared "$4" '
              ($changed | split("\n") | map(select(. != ""))) as $files
              | map(select(. as $entry | $files | any(
                  . == "*" or test($shared) or startswith("\($dir)/\($entry[$key])/"))))' <<<"$1"
          }
          contract='^(apps/api/openapi\.json|apps/api/test/serve\.ts|\.github/workflows/ci\.yml)$'
          integrations="$(pick "$INTEGRATIONS" driver integrations "$contract|^integrations/conformance/(http|message)\.json$")"
          sdks="$(pick "$SDKS" sdk sdks "$contract|^integrations/conformance/webhooks\.json$")"
          echo "integrations=$integrations" >> "$GITHUB_OUTPUT"
          echo "sdks=$sdks" >> "$GITHUB_OUTPUT"
          echo "Drivers: $(jq --raw-output 'map("\(.driver) (\(.versions))") | join(", ") | if . == "" then "none" else . end' <<<"$integrations")"
          echo "SDKs: $(jq --raw-output 'map("\(.sdk) (\(.versions))") | join(", ") | if . == "" then "none" else . end' <<<"$sdks")"

  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # Pull-request code never receives remote-cache credentials: anything that can read the signed
    # cache can also write to it. Merge queue runs (enqueued only by people who can merge) and
    # dispatches populate it.
    env:
      TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name != 'pull_request' && vars.TURBO_TEAM || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name != 'pull_request' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck $AFFECTED

  test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test $AFFECTED

  # A browser through the dashboard's first hour, on the exact commit main becomes.
  e2e:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate:test
      - run: bunx turbo run build --filter=coss
      - run: bun run --cwd apps/web playwright install --with-deps chromium
      - run: bun run --cwd apps/web e2e

  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      # The check job typechecks both Next apps; `next build` skips its own copy of that check.
      SKIP_BUILD_TYPECHECK: "1"
      # Like the check job's.
      TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name != 'pull_request' && vars.TURBO_TEAM || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name != 'pull_request' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Turbopack's build cache (.next/cache/turbopack): builds start warm when an app's turbo
      # task misses. Reset whenever dependencies change, so it doesn't grow forever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/.next/cache
            apps/site/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build $AFFECTED

  # The framework drivers (integrations/*: not workspaces, so turbo never runs them): lint and
  # tests (the entries `changes` picked), plus, on the newest framework, an end-to-end run against
  # the API's test app (`apps/api/test/serve.ts`) on this job's Postgres.
  integrations:
    name: integrations (${{ matrix.driver }}, ${{ matrix.versions }})
    needs: changes
    if: needs.changes.outputs.integrations != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.integrations) }}
    services:
      postgres:
        # Only the end-to-end entries use it: an empty image starts no container.
        image: ${{ matrix.e2e && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The API's test app, for the end-to-end tests: COSS_E2E is the line serve.ts prints.
      - if: matrix.e2e
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - if: matrix.e2e
        run: |
          bun install --frozen-lockfile
          bun run db:migrate:test
          bun run --cwd apps/api serve:test > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do
            line="$(grep -m1 '^{"base_url"' "$RUNNER_TEMP/serve.log" || true)"
            if [ -n "$line" ]; then
              echo "COSS_E2E=$line" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - if: matrix.driver == 'laravel'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - if: matrix.driver == 'laravel'
        working-directory: integrations/laravel
        run: |
          composer update --no-interaction --no-progress --prefer-stable ${{ matrix.composer }}
          # Pint's rules change between versions, so only the newest dependencies lint.
          if [ "${{ matrix.lint }}" = "true" ]; then composer lint; fi
          composer test

      - if: matrix.driver == 'rails'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: integrations/rails
      - if: matrix.driver == 'rails'
        working-directory: integrations/rails
        run: |
          bundle exec rubocop
          bundle exec rake test
          gem build coss-rails.gemspec

      - if: matrix.driver == 'django'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # The default globs (**/pyproject.toml, …) walk node_modules after `bun install` and
          # never finish.
          cache-dependency-glob: integrations/django/uv.lock
      - if: matrix.driver == 'django'
        working-directory: integrations/django
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run --with "${{ matrix.django }}" pytest
          uv build
          uvx twine check dist/*

  # The generated SDKs (sdks/*: not workspaces, so turbo never runs them): each one's tests (its
  # generated ones and our own: the webhook and HTTP conformance, sdks/AGENTS.md) on the runtimes
  # `changes` picked, plus, on the newest, the end-to-end tests against the API's test app.
  # Regenerating them needs Docker and runs on main (sdks-regenerate.yml), not here.
  sdks:
    name: sdks (${{ matrix.sdk }}, ${{ matrix.versions }})
    needs: changes
    if: needs.changes.outputs.sdks != '[]'
    # Gradle, .NET and Go builds want more than the drivers' two cores.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.sdks) }}
    services:
      postgres:
        # Like the drivers': only the end-to-end entries use it.
        image: ${{ matrix.e2e && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sdks/${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The API's test app, for the end-to-end tests: COSS_E2E is the line serve.ts prints.
      - if: matrix.e2e
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - if: matrix.e2e
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run db:migrate:test
          bun run --cwd apps/api serve:test > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do
            line="$(grep -m1 '^{"base_url"' "$RUNNER_TEMP/serve.log" || true)"
            if [ -n "$line" ]; then
              echo "COSS_E2E=$line" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - if: matrix.sdk == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - if: matrix.sdk == 'python'
        run: |
          uv venv
          uv pip install -e . pytest pytest-asyncio
          # Our files only (the generated code is the generator's); Ruff at the version it pins.
          uvx ruff@0.11.5 check src/coss/webhooks.py tests/custom
          uvx ruff@0.11.5 format --check src/coss/webhooks.py tests/custom
          .venv/bin/pytest
          uv build

      - if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: sdks/go/go.sum
      - if: matrix.sdk == 'go'
        run: |
          test -z "$(gofmt -l webhooks.go custom_*_test.go)"
          go vet ./...
          go test ./...

      - if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: sdks/ruby
      - if: matrix.sdk == 'ruby'
        run: |
          bundle exec rubocop
          bundle exec rake test
          gem build coss.gemspec

      - if: matrix.sdk == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - if: matrix.sdk == 'php' && matrix.syntax-only
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - if: matrix.sdk == 'php' && !matrix.syntax-only
        run: |
          composer validate
          composer update --no-interaction --no-progress --prefer-stable
          composer build
          composer test

      - if: matrix.sdk == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: matrix.sdk == 'java'
        run: ./gradlew --no-daemon test publishMavenPublicationToBundleRepository

      - if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - if: matrix.sdk == 'dotnet'
        env:
          # The test project targets .NET 9: run it on the newest runtime installed.
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet format whitespace src/Coss.Test/Coss.Test.csproj --verify-no-changes --include src/Coss/Webhooks.cs src/Coss.Test/Custom/
          dotnet test src/Coss.Test/Coss.Test.csproj
          dotnet pack src/Coss/Coss.csproj --configuration Release

  # Changes to the public packages' sources (packages/sdk/src, except generated version.ts,
  # packages/mcp/src and packages/cli/src) need a changeset: `bun run changeset`, or `bun run changeset --empty` when
  # nothing user-facing changed. Everything else in the repo is private and never versioned.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}

  # The one check main's ruleset requires, on pull requests and in the merge queue: every job
  # above passed or was skipped on purpose (the matrices also skip when `changes` failed, which
  # fails this too).
  ci:
    if: ${{ !cancelled() }}
    needs: [changes, check, test, e2e, build, integrations, sdks, changeset]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Jobs: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
